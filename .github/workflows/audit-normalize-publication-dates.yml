name: Audit and normalize historical publication dates
on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_historical_publication_dates.py'
      - 'scripts/normalize_gemini_publication_zip.py'
      - 'scripts/repair_imported_article_metadata.py'
      - 'scripts/trim_overlength_articles.py'
      - 'scripts/audit_article_lengths.py'
      - '.github/workflows/audit-normalize-publication-dates.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: ttn-historical-date-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintenance dependencies
        run: python -m pip install -r requirements-maintenance.txt
      - name: Validate publication maintenance scripts
        run: python -m py_compile scripts/normalize_historical_publication_dates.py scripts/repair_imported_article_metadata.py scripts/normalize_gemini_publication_zip.py scripts/import_publication_zip.py
      - name: Remove unsupported publication clock times
        run: python scripts/normalize_historical_publication_dates.py
      - name: Repair imported article citations and image metadata
        run: python scripts/repair_imported_article_metadata.py
      - name: Trim articles to the approved 700-900 word range
        run: python scripts/trim_overlength_articles.py
      - name: Rebuild article cards, archives and homepage
        run: |
          python scripts/refresh_static_editorial.py
          python scripts/refresh_seo_metadata.py
          python scripts/refresh_social_cards.py
      - name: Audit article lengths
        run: python scripts/audit_article_lengths.py
      - name: Audit metadata, links, navigation and static integrity
        run: python scripts/verify_site.py
      - name: Audit original article SEO metadata
        run: python scripts/audit_original_seo.py
      - name: Audit all article cover images
        run: python scripts/audit_original_images.py
      - name: Test independent loading and navigation
        run: |
          node scripts/test-independent-loading.cjs
          node scripts/test-navigation.cjs
      - name: Commit verified audit corrections
        id: save
        run: |
          git config user.name "ttn-publication-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Normalize unsupported historical publication times [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages rebuild
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "::warning::Check Pages deployment status"
