name: Market calendar source diagnostics
on:
  push:
    paths: ['.github/workflows/calendar-source-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test official calendar feeds
        shell: bash
        run: |
          set +e
          for url in 'https://www.bls.gov/schedule/news_release/bls.ics' 'https://www.bea.gov/news/schedule/ics/online-calendar-subscription.ics' 'https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm'; do
            echo "Checking $url"
            curl --location --silent --show-error --max-time 25 --retry 1 --user-agent 'Mozilla/5.0 (compatible; TTNFinanceCalendar/1.0)' --output /tmp/calendar-test --write-out 'HTTP %{http_code} bytes %{size_download}\n' "$url"
            head -c 150 /tmp/calendar-test || true
            echo
          done
