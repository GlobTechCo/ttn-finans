name: Market calendar source diagnostics
on:
  push:
    paths: ['.github/workflows/calendar-source-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Federal Reserve sources
        run: |
          python3 - <<'PY'
          import urllib.request,re
          urls=['https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm','https://fred.stlouisfed.org/series/CPIAUCSL','https://fred.stlouisfed.org/series/UNRATE']
          for url in urls:
              print('\nURL:',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'TTNFinanceCalendar/1.0 contact via https://globtechco.github.io/ttn-finans/contact.html'})
                  with urllib.request.urlopen(req, timeout=20) as f: text=f.read().decode('utf-8','replace')
                  print('HTTP 200, bytes:',len(text))
                  for pat in ['fomc-meeting__month','fomc-meeting__date','Next Release Date','next-release']:
                      m=re.search(pat,text,re.I)
                      if m: print('MARKER',pat,repr(text[max(0,m.start()-400):m.start()+700]))
              except Exception as e: print('FAILED',str(e))
          PY
