name: Publish approved TTN four articles November 2
on:
  push:
    branches: [main]
    paths:
      - 'TTN_Finance_4_Articles_AUTO_PUBLISH_2026-11-02.zip'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: ttn-four-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          pip install beautifulsoup4 lxml
          if [ -f requirements-maintenance.txt ]; then pip install -r requirements-maintenance.txt; fi
      - name: Validate and publish four articles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_four_approved_nov02.py
      - name: Rebuild Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
