name: Publish approved article ZIP
on:
  push:
    branches: [main]
    paths:
      - 'publish-queue/*.zip'
      - 'TTN_Finance_*_AutoPublish_*.zip'
      - 'scripts/import_publication_zip.py'
      - '.github/workflows/publish-approved-zip.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: ttn-editorial-zip-import
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pending archive and importer
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/import_publication_zip.py
          shopt -s nullglob
          archives=(publish-queue/*.zip TTN_Finance_*_AutoPublish_*.zip)
          echo "Pending publication archives: ${#archives[@]}"
          printf ' - %s\n' "${archives[@]}"
          if (( ${#archives[@]} == 0 )); then
            echo "::error::No queued ZIP. Nothing to publish."
            exit 1
          fi
          python - <<'PY'
          import glob, json, zipfile
          files = glob.glob("publish-queue/*.zip") + glob.glob("TTN_Finance_*_AutoPublish_*.zip")
          for path in files:
              with zipfile.ZipFile(path) as archive:
                  manifest = json.loads(archive.read("publication-manifest.json"))
                  print(f"{path}: {len(manifest)} articles, {len(archive.namelist())} archive entries")
                  for item in manifest:
                      print(f"  {item['section']}: {item['slug']}")
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements-maintenance.txt
      - name: Import approved articles
        shell: bash
        run: |
          shopt -s nullglob
          archives=(publish-queue/*.zip TTN_Finance_*_AutoPublish_*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo "::error::No approved ZIPs found in queue"
            exit 1
          fi
          python scripts/import_publication_zip.py "${archives[@]}"
          rm -- "${archives[@]}"
      - name: Refresh catalog, archives, homepage, social cards and sitemaps
        run: |
          python scripts/refresh_static_editorial.py
          python scripts/refresh_seo_metadata.py
          python scripts/refresh_social_cards.py
      - name: Verify articles and static site
        run: |
          python scripts/audit_article_lengths.py
          python scripts/verify_site.py
          node scripts/test-independent-loading.cjs
          node scripts/test-navigation.cjs
      - name: Commit validated site
        id: saved
        run: |
          git config user.name "ttn-publication-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish approved article ZIP and update site indexes"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages branch rebuild
        if: steps.saved.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "::warning::Check Pages deployment status"

      - name: Report failed publication stage
        if: failure()
        shell: bash
        run: |
          {
            echo '## Automatic publication failed'
            echo
            echo 'The uploaded ZIP has **not** been published. Check the first failed step above for its exact error message.'
            echo
            echo '### Archive queue'
            find . -maxdepth 2 -name '*.zip' -print
            echo
            echo '### Repository'
            git log -1 --oneline
          } | tee -a "$GITHUB_STEP_SUMMARY"
