name: Publish approved article ZIP
# Re-run the November 20 package after editorial-length audit diagnostics were improved.
# Re-run against the latest main revision; serialize publication after concurrent maintenance commits.
on:
  push:
    branches: [main]
    paths:
      - 'publish-queue/*.zip'
      - 'ttn-finance-november-17-2026.zip'
      - 'ttn-finance-publication-2026-11-21-updated.zip'
      - 'ttn-finance-publication-2026-11-21-package2-v2.zip'
      - 'ttn-finance-three-articles-2026-11-14.zip'
      - 'TTN_Finance_*_AutoPublish_*.zip'
      - 'TTN_Finance_3_Articles_2026-11-14_Evening.zip'
      - 'pub_new.zip'
      - 'TTN_Finance_3_Approved_Articles_2026-11-13_READY.zip'
      - 'TTN_Finance_Three_Articles_2026-11-15.zip'
      - 'TTN_Finance_Publication_Package_2026-11-16.zip'
      - 'TTN_Finance_2026-11-18_GITHUB_UPLOAD.zip'
      - 'TTN_Finance_2026-11-20_GITHUB_UPLOAD.zip'
      - 'TTN_Finance_November_19_2026.zip'
      - 'TTN_Finance_Three_Articles_2026-11-23_WITH_COVERS.zip'
      - '.github/workflows/publish-approved-zip.yml'
      - 'scripts/normalize_gemini_publication_zip.py'
      - 'scripts/import_publication_zip.py'
      - 'scripts/article_tickers.py'
  workflow_dispatch:
    inputs:
      archive:
        description: 'Exact ZIP path to publish (for example: publish-queue/approved.zip or TTN_Finance_Publication_Package_2026-11-16.zip)'
        required: true
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: ttn-editorial-zip-import
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Select only the archive from this upload
        id: select
        shell: bash
        env:
          REQUESTED_ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail
          archives=()
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            while IFS= read -r file; do
              case "$file" in
                publish-queue/*.zip|ttn-finance-november-17-2026.zip|ttn-finance-publication-2026-11-21-updated.zip|ttn-finance-publication-2026-11-21-package2-v2.zip|ttn-finance-three-articles-2026-11-14.zip|TTN_Finance_*_AutoPublish_*.zip|TTN_Finance_3_Articles_2026-11-14_Evening.zip|TTN_Finance_3_Approved_Articles_2026-11-13_READY.zip|TTN_Finance_Three_Articles_2026-11-15.zip|TTN_Finance_Publication_Package_2026-11-16.zip|TTN_Finance_2026-11-18_GITHUB_UPLOAD.zip|TTN_Finance_2026-11-20_GITHUB_UPLOAD.zip|TTN_Finance_November_19_2026.zip|TTN_Finance_Three_Articles_2026-11-23_WITH_COVERS.zip|.github/workflows/publish-approved-zip.yml|scripts/normalize_gemini_publication_zip.py|scripts/import_publication_zip.py|scripts/article_tickers.py|pub_new.zip)
                  if [[ "$file" == ".github/workflows/publish-approved-zip.yml" || "$file" == "scripts/normalize_gemini_publication_zip.py" || "$file" == "scripts/import_publication_zip.py" || "$file" == "scripts/article_tickers.py" ]]; then
                  file="TTN_Finance_Three_Articles_2026-11-23_WITH_COVERS.zip"
                fi
                [[ -f "$file" ]] && archives+=("$file")
                  ;;
              esac
            done < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          else
            file="$REQUESTED_ARCHIVE"
            case "$file" in
              publish-queue/*.zip|ttn-finance-november-17-2026.zip|ttn-finance-publication-2026-11-21-updated.zip|ttn-finance-publication-2026-11-21-package2-v2.zip|ttn-finance-three-articles-2026-11-14.zip|TTN_Finance_*_AutoPublish_*.zip|TTN_Finance_3_Articles_2026-11-14_Evening.zip|TTN_Finance_3_Approved_Articles_2026-11-13_READY.zip|TTN_Finance_Publication_Package_2026-11-16.zip|TTN_Finance_2026-11-18_GITHUB_UPLOAD.zip|TTN_Finance_2026-11-19_GITHUB_UPLOAD.zip|TTN_Finance_2026-11-20_GITHUB_UPLOAD.zip|TTN_Finance_November_19_2026.zip|TTN_Finance_Three_Articles_2026-11-23_WITH_COVERS.zip|pub_new.zip) ;;
              *) echo "::error::Choose a ZIP in publish-queue/, ttn-finance-november-17-2026.zip, ttn-finance-three-articles-2026-11-14.zip, a matching TTN_Finance_*_AutoPublish_*.zip, TTN_Finance_3_Articles_2026-11-14_Evening.zip, the approved 2026-11-13 READY ZIP, TTN_Finance_Three_Articles_2026-11-15.zip, TTN_Finance_Publication_Package_2026-11-16.zip, TTN_Finance_2026-11-18_GITHUB_UPLOAD.zip, TTN_Finance_November_19_2026.zip, or pub_new.zip"; exit 1 ;;
            esac
            [[ -f "$file" ]] || { echo "::error::Selected archive does not exist: $file"; exit 1; }
            archives+=("$file")
          fi
          if (( ${#archives[@]} == 0 )); then
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              echo "::notice::No added or modified publication ZIP in this push; skipping deletion-only trigger."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No approved publication ZIP was selected."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          printf 'Selected archive: %s\n' "${archives[@]}"
          {
            echo 'archives<<EOF'
            printf '%s\n' "${archives[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.select.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - name: Normalize Gemini publication package
        if: steps.select.outputs.skip != 'true'
        id: normalize
        shell: bash
        env:
          ARCHIVES: ${{ steps.select.outputs.archives }}
        run: |
          set -euo pipefail
          python -m pip install lxml pillow markdown
          echo "Preparing the reviewed Nov. 16 package or normalizing legacy packages."
          mapfile -t archives <<< "$ARCHIVES"
          normalized=()
          for archive in "${archives[@]}"; do
            if [[ "$(basename "$archive")" == "TTN_Finance_Publication_Package_2026-11-16.zip" ]]; then
              output="/tmp/ttn-nov16-import.zip"
              python scripts/prepare_nov16_publication.py "$archive" "$output"
              normalized+=("$output")
            else
              python scripts/normalize_gemini_publication_zip.py "$archive"
              normalized+=("$archive")
            fi
          done
          {
            echo 'archives<<EOF'
            printf '%s\n' "${normalized[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Validate selected archive and importer
        if: steps.select.outputs.skip != 'true'
        shell: bash
        env:
          ARCHIVES: ${{ steps.normalize.outputs.archives }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/import_publication_zip.py scripts/prepare_nov16_publication.py
          mapfile -t archives <<< "$ARCHIVES"
          python - "${archives[@]}" <<'PY'
          import json, sys, zipfile
          for path in sys.argv[1:]:
              with zipfile.ZipFile(path) as archive:
                  print("ZIP CONTENTS:", "\\n".join(archive.namelist()))
                  if "publication-manifest.json" not in archive.namelist():
                      for name in archive.namelist():
                          if name.endswith("-seo.json") or name.endswith("-fragment.html") or name.endswith("README.txt"):
                              print("\\n--- FILE:", name, "---\\n")
                              print(archive.read(name).decode("utf-8")[:12000])
                      raise SystemExit("Missing publication-manifest.json; diagnostic package contents printed above.")
                  manifest = json.loads(archive.read("publication-manifest.json"))
                  print(f"{path}: {len(manifest)} articles, {len(archive.namelist())} archive entries")
                  for item in manifest:
                      print(f"  {item['section']}: {item['slug']}")
          PY
      - name: Install dependencies
        if: steps.select.outputs.skip != 'true'
        run: python -m pip install -r requirements-maintenance.txt
      - name: Import approved articles
        if: steps.select.outputs.skip != 'true'
        shell: bash
        env:
          ARCHIVES: ${{ steps.normalize.outputs.archives }}
        run: |
          set -euo pipefail
          mapfile -t archives <<< "$ARCHIVES"
          python scripts/import_publication_zip.py "${archives[@]}"
          rm -- "${archives[@]}"
      - name: Refresh catalog, archives, homepage, social cards and sitemaps
        if: steps.select.outputs.skip != 'true'
        run: |
          python scripts/refresh_static_editorial.py
          python scripts/refresh_seo_metadata.py
          python scripts/refresh_social_cards.py
      - name: Verify articles and static site
        if: steps.select.outputs.skip != 'true'
        run: |
          python scripts/audit_article_lengths.py
          python scripts/verify_site.py
          node scripts/test-independent-loading.cjs
          node scripts/test-navigation.cjs
      - name: Commit validated site
        if: steps.select.outputs.skip != 'true'
        id: saved
        run: |
          git config user.name "ttn-publication-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish approved article ZIP and update site indexes"
          if ! git pull --rebase origin main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              case "$file" in
                sitemap.xml)
                  # Keep the latest sitemap from main, then regenerate it after the merge.
                  git checkout --ours "$file"
                  ;;
                market-analysis-morgan-stanley-bullish-stocks.html|tech-ai-nvidia-reinstates-jensen-huang.html|crypto-bitcoin-seven-week-losing-streak.html)
                  # These exact pages are being replaced by this approved correction import.
                  # During rebase, --theirs is the publication commit being replayed.
                  git checkout --theirs "$file"
                  ;;
                *)
                  echo "::error::Unexpected rebase conflict: $file"
                  exit 1
                  ;;
              esac
              git add "$file"
            done <<< "$conflicts"
            GIT_EDITOR=true git rebase --continue
            python scripts/refresh_static_editorial.py
            python scripts/refresh_seo_metadata.py
            python scripts/refresh_social_cards.py
            python scripts/audit_article_lengths.py
            python scripts/verify_site.py
            git add -A
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages branch rebuild
        if: steps.select.outputs.skip != 'true' && steps.saved.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "::warning::Check Pages deployment status"
      - name: Report failed publication stage
        if: failure()
        shell: bash
        run: |
          {
            echo '## Automatic publication failed'
            echo
            echo 'The uploaded ZIP has **not** been published. Check the first failed step above for its exact error message.'
            echo
            echo '### Selected archive'
            echo '${{ github.event.head_commit.message || github.event_name }}'
            echo
            echo '### Repository'
            git log -1 --oneline
          } | tee -a "$GITHUB_STEP_SUMMARY"
