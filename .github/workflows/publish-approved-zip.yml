name: Publish approved article ZIP
on:
  push:
    branches: [main]
    paths:
      - 'publish-queue/*.zip'
      - 'ttn-finance-three-articles-2026-11-14.zip'
      - 'TTN_Finance_*_AutoPublish_*.zip'
      - 'TTN_Finance_3_Articles_2026-11-14_Evening.zip'
      - 'pub_new.zip'
      - 'TTN_Finance_3_Approved_Articles_2026-11-13_READY.zip'
  workflow_dispatch:
    inputs:
      archive:
        description: 'Exact ZIP path to publish (for example: publish-queue/approved.zip)'
        required: true
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: ttn-editorial-zip-import
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Select only the archive from this upload
        id: select
        shell: bash
        env:
          REQUESTED_ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail
          archives=()
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            while IFS= read -r file; do
              case "$file" in
                publish-queue/*.zip|ttn-finance-three-articles-2026-11-14.zip|TTN_Finance_*_AutoPublish_*.zip|TTN_Finance_3_Articles_2026-11-14_Evening.zip|TTN_Finance_3_Approved_Articles_2026-11-13_READY.zip|pub_new.zip)
                  [[ -f "$file" ]] && archives+=("$file")
                  ;;
              esac
            done < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          else
            file="$REQUESTED_ARCHIVE"
            case "$file" in
              publish-queue/*.zip|ttn-finance-three-articles-2026-11-14.zip|TTN_Finance_*_AutoPublish_*.zip|TTN_Finance_3_Articles_2026-11-14_Evening.zip|TTN_Finance_3_Approved_Articles_2026-11-13_READY.zip|pub_new.zip) ;;
              *) echo "::error::Choose a ZIP in publish-queue/, ttn-finance-three-articles-2026-11-14.zip, a matching TTN_Finance_*_AutoPublish_*.zip, TTN_Finance_3_Articles_2026-11-14_Evening.zip, the approved 2026-11-13 READY ZIP, or pub_new.zip"; exit 1 ;;
            esac
            [[ -f "$file" ]] || { echo "::error::Selected archive does not exist: $file"; exit 1; }
            archives+=("$file")
          fi
          if (( ${#archives[@]} == 0 )); then
            echo "::error::No approved publication ZIP was selected."
            exit 1
          fi
          printf 'Selected archive: %s\n' "${archives[@]}"
          {
            echo 'archives<<EOF'
            printf '%s\n' "${archives[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate selected archive and importer
        shell: bash
        env:
          ARCHIVES: ${{ steps.select.outputs.archives }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/import_publication_zip.py
          mapfile -t archives <<< "$ARCHIVES"
          python - "${archives[@]}" <<'PY'
          import json, sys, zipfile
          for path in sys.argv[1:]:
              with zipfile.ZipFile(path) as archive:
                  manifest = json.loads(archive.read("publication-manifest.json"))
                  print(f"{path}: {len(manifest)} articles, {len(archive.namelist())} archive entries")
                  for item in manifest:
                      print(f"  {item['section']}: {item['slug']}")
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements-maintenance.txt
      - name: Import approved articles
        shell: bash
        env:
          ARCHIVES: ${{ steps.select.outputs.archives }}
        run: |
          set -euo pipefail
          mapfile -t archives <<< "$ARCHIVES"
          python scripts/import_publication_zip.py "${archives[@]}"
          rm -- "${archives[@]}"
      - name: Refresh catalog, archives, homepage, social cards and sitemaps
        run: |
          python scripts/refresh_static_editorial.py
          python scripts/refresh_seo_metadata.py
          python scripts/refresh_social_cards.py
      - name: Verify articles and static site
        run: |
          python scripts/audit_article_lengths.py
          python scripts/verify_site.py
          node scripts/test-independent-loading.cjs
          node scripts/test-navigation.cjs
      - name: Commit validated site
        id: saved
        run: |
          git config user.name "ttn-publication-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish approved article ZIP and update site indexes"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages branch rebuild
        if: steps.saved.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "::warning::Check Pages deployment status"
      - name: Report failed publication stage
        if: failure()
        shell: bash
        run: |
          {
            echo '## Automatic publication failed'
            echo
            echo 'The uploaded ZIP has **not** been published. Check the first failed step above for its exact error message.'
            echo
            echo '### Selected archive'
            echo '${{ github.event.head_commit.message || github.event_name }}'
            echo
            echo '### Repository'
            git log -1 --oneline
          } | tee -a "$GITHUB_STEP_SUMMARY"
