name: Repair Nov 16 article publication order
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-nov16-order.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: ttn-editorial-order-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintenance dependencies
        run: python -m pip install -r requirements-maintenance.txt
      - name: Set actual publication timestamp
        run: python scripts/fix_nov16_publication_order.py
      - name: Rebuild homepage, archives, metadata and sitemaps
        run: |
          python scripts/refresh_static_editorial.py
          python scripts/refresh_seo_metadata.py
          python scripts/refresh_social_cards.py
      - name: Audit generated site
        run: |
          python scripts/audit_article_lengths.py
          python scripts/verify_site.py
          node scripts/test-independent-loading.cjs
          node scripts/test-navigation.cjs
      - name: Commit repaired publication order
        run: |
          git config user.name "ttn-publication-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Nov 16 article publication chronology"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
