name: Generate TTN Original image
on:
  push:
    branches: [main]
    paths: ['assets/editorial/ttn-oil-inflation-2026.svg']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -background none assets/editorial/ttn-oil-inflation-2026.svg -resize 1200x630! assets/editorial/ttn-oil-inflation-2026.png
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/editorial/ttn-oil-inflation-2026.png
          git diff --cached --quiet || git commit -m "Generate TTN Original social image"
          git push
