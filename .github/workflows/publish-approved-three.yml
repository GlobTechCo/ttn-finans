name: Publish approved TTN Finance articles
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/publish_approved_three.py'
      - 'scripts/refresh_static_editorial.py'
      - 'ttn_three_articles_publication_package.zip'
      - 'TTN_Finance_3_approved_articles_PUBLISH_2026-11-01.zip'
      - 'TTN_DEWA_approved_article_PUBLISH_2026-11-01.zip'
      - 'TTN_BTC_ETH_October_2026_PUBLISH.zip'
      - 'TTN_Polymarket_DeepSeek_APPROVED_PUBLISH_2026-11-01.zip'
      - 'TTN_Three_Articles_APPROVED_PUBLISH_2026-11-02.zip'
      - 'TTN_Two_Approved_Articles_PUBLISH_2026-11-02.zip'
      - 'TTN_NVIDIA_RTX_Spark_827_words_FINAL.zip'
      - '.github/workflows/publish-approved-three.yml'
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install beautifulsoup4 lxml
          if [ -f requirements-maintenance.txt ]; then python -m pip install -r requirements-maintenance.txt; fi
      - name: Build, test and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_approved_three.py
      - name: Request GitHub Pages rebuild after bot commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub Actions commits do not trigger ordinary push-based Pages builds.
          # Explicitly request a Pages rebuild for repositories publishing from a branch.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo 'Pages rebuild API unavailable; inspect Pages source settings.'
