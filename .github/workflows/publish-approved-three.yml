name: Publish approved TTN Finance articles
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/publish_approved_three.py'
      - 'scripts/refresh_static_editorial.py'
      - 'ttn_three_articles_publication_package.zip'
      - '.github/workflows/publish-approved-three.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install beautifulsoup4 lxml
          if [ -f requirements-maintenance.txt ]; then python -m pip install -r requirements-maintenance.txt; fi
      - name: Build, test and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_approved_three.py
