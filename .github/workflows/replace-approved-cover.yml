name: Replace approved editorial cover
on:
  push:
    branches: [main]
    paths:
      - 'cover-replacements/*.zip'
      - 'TTN_Finance_Approved_Cover_Replacement_*.zip'
      - '.github/workflows/replace-approved-cover.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: ttn-editorial-zip-import
  cancel-in-progress: false
jobs:
  replace-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-maintenance.txt
      - name: Apply uploaded approved cover
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(cover-replacements/*.zip TTN_Finance_Approved_Cover_Replacement_*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo "::error::Missing approved cover ZIP"
            exit 1
          fi
          python -m py_compile scripts/replace_approved_cover.py
          python scripts/replace_approved_cover.py "${archives[@]}"
          rm -- "${archives[@]}"
      - name: Refresh article catalog, homepage and section references
        run: python scripts/refresh_static_editorial.py
      - name: Update article social images
        run: python scripts/refresh_social_cards.py
      - name: Verify website
        run: |
          python scripts/audit_article_lengths.py
          python scripts/verify_site.py
          node scripts/test-independent-loading.cjs
          node scripts/test-navigation.cjs
      - name: Save verified change
        run: |
          git config user.name "ttn-publication-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No changed files after replacement"
            exit 1
          fi
          git commit -m "Replace approved Market Analysis cover and refresh social previews"
          git push origin HEAD:main
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "::warning::Check Pages deployment status"
