name: Publish approved Meta and Apple October 31 articles
on:
  push:
    paths:
      - 'TTN_Finance_Meta_Apple_Publication_2026-10-31.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ttn-publish-meta-apple-oct31
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install beautifulsoup4 lxml
          if [ -f requirements-maintenance.txt ]; then python -m pip install -r requirements-maintenance.txt; fi
      - name: Publish verified approved articles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_meta_apple_oct31.py
