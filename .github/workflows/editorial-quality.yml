name: TTN editorial quality
on:
  pull_request:
  push:
    branches: [main, codex/crypto-section, codex/article-tickers]
    paths:
      - '*.html'
      - 'articles.js'
      - 'crypto.js'
      - 'crypto.css'
      - 'chart.js'
      - 'market-tape.js'
      - 'scripts/test-crypto-section.cjs'
      - 'scripts/test-article-tickers.cjs'
      - 'scripts/article_tickers.py'
      - 'scripts/refresh_static_editorial.py'
      - 'scripts/audit_article_lengths.py'
      - 'scripts/verify_site.py'
      - 'scripts/refresh_social_cards.py'
      - 'scripts/social-card-manifest.json'
      - 'assets/social/**'
      - 'requirements-maintenance.txt'
      - '.github/workflows/editorial-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce approved editorial lengths
        run: python3 scripts/audit_article_lengths.py
      - name: Install site verification dependencies
        run: python3 -m pip install -r requirements-maintenance.txt
      - name: Check metadata and site integrity
        run: python3 scripts/verify_site.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Check editorial sections on desktop and mobile
        run: |
          python3 -m http.server 8765 >/tmp/ttn-editorial-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          TTN_TEST_BASE=http://127.0.0.1:8765/ TTN_SCREENSHOT_DIR=/tmp/ttn-crypto-browser node scripts/test-crypto-section.cjs
          TTN_TEST_BASE=http://127.0.0.1:8765/ TTN_SCREENSHOT_DIR=/tmp/ttn-crypto-browser node scripts/test-article-tickers.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crypto-layout-review
          path: /tmp/ttn-crypto-browser/*.png
          retention-days: 3
