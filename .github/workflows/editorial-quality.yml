name: TTN editorial quality
# WebP derivatives are committed only after full site verification succeeds.
on:
  pull_request:
  push:
    branches: [main, codex/crypto-section, codex/article-tickers]
    paths:
      - '*.html'
      - 'articles.js'
      - 'crypto.js'
      - 'crypto.css'
      - 'chart.js'
      - 'market-tape.js'
      - 'scripts/test-crypto-section.cjs'
      - 'scripts/test-article-tickers.cjs'
      - 'scripts/test-article-share.cjs'
      - 'article-share.js'
      - 'article-share.css'
      - 'scripts/article_tickers.py'
      - 'scripts/refresh_static_editorial.py'
      - 'scripts/audit_article_lengths.py'
      - 'scripts/verify_site.py'
      - 'scripts/refresh_social_cards.py'
      - 'scripts/optimize_legacy_covers.py'
      - 'scripts/social-card-manifest.json'
      - 'assets/social/**'
      - 'requirements-maintenance.txt'
      - '.github/workflows/editorial-quality.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce approved editorial lengths
        run: python3 scripts/audit_article_lengths.py
      - name: Install site verification dependencies
        run: python3 -m pip install -r requirements-maintenance.txt
      - name: Optimize legacy covers and refresh social cards
        run: |
          python3 scripts/optimize_legacy_covers.py
          python3 scripts/refresh_social_cards.py
      - name: Check metadata and site integrity
        run: python3 scripts/verify_site.py
      - name: Audit historical article SEO flags (read-only)
        run: python3 scripts/audit_original_seo.py
      - name: Audit all published article cover files (read-only)
        run: python3 scripts/audit_original_images.py
      - name: Save verified WebP derivatives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "ttn-image-optimization-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No optimized image changes to save."
            exit 0
          fi
          git commit -m "Optimize legacy cover delivery with WebP [skip ci]"
          git push origin HEAD:main
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Check editorial sections on desktop and mobile
        run: |
          python3 -m http.server 8765 >/tmp/ttn-editorial-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          TTN_TEST_BASE=http://127.0.0.1:8765/ TTN_SCREENSHOT_DIR=/tmp/ttn-crypto-browser node scripts/test-crypto-section.cjs
          TTN_TEST_BASE=http://127.0.0.1:8765/ TTN_SCREENSHOT_DIR=/tmp/ttn-crypto-browser node scripts/test-article-tickers.cjs
          TTN_TEST_BASE=http://127.0.0.1:8765/ node scripts/test-article-share.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crypto-layout-review
          path: /tmp/ttn-crypto-browser/*.png
          retention-days: 3
