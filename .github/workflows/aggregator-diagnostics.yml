name: TTN Aggregator browser diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aggregator-diagnostics.yml'
      - 'news.js'
      - 'config.js'
      - 'scripts/test-independent-loading.cjs'
      - 'scripts/test-news-feed.cjs'
      - 'scripts/test_news_feed.py'
permissions:
  contents: read
jobs:
  news-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Check RSS parsing and independent startup
        run: |
          python3 scripts/test_news_feed.py
          node scripts/test-independent-loading.cjs
          node scripts/test-navigation.cjs
      - name: Check site consistency
        run: |
          python3 -m pip install -r requirements-maintenance.txt
          python3 scripts/verify_site.py
      - name: Install pinned browser diagnostic dependency
        run: npm install --no-save playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise candidate news reader on desktop and mobile
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/ttn-news-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          TTN_TEST_BASE=http://127.0.0.1:8765/ node scripts/test-news-feed.cjs
      - name: Wait for publication and verify live news reader
        shell: bash
        run: |
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("https://globtechco.github.io/ttn-finans/?news-check=20261020",timeout=10) as response:
                      body=response.read().decode()
                  if "rss-snapshot-20261020" in body: break
              except Exception: pass
              time.sleep(5)
          else: raise SystemExit("Updated news reader has not reached the live site")
          PY
          node scripts/test-news-feed.cjs
