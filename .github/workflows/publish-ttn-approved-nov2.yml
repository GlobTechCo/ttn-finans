name: Publish approved TTN November 2 articles
on:
  push:
    branches: [main]
    paths:
      - 'TTN_Finance_3_publications_2026-11-02.zip'
      - 'scripts/publish_approved_three.py'
      - 'scripts/refresh_static_editorial.py'
      - 'articles.js'
      - '.github/workflows/publish-ttn-approved-nov2.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install beautifulsoup4 pillow lxml
      - name: Configure publishing commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish approved stories and verify
        run: |
          set -o pipefail
          python3 scripts/publish_approved_three.py 2>&1 | tee /tmp/ttn-publish-log.txt
      - name: Report publication failure for diagnosis
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 100 /tmp/ttn-publish-log.txt > /tmp/ttn-publish-error.txt || true
          gh issue create --title 'TTN November 2 publishing error (diagnostic)' --body-file /tmp/ttn-publish-error.txt || true
