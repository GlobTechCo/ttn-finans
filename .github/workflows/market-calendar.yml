name: Refresh market calendar
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_market_calendar.py'
      - '.github/workflows/market-calendar.yml'
permissions:
  contents: write
concurrency:
  group: ttn-market-calendar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fetch and validate official schedules
        run: python3 scripts/update_market_calendar.py
      - name: Publish validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-calendar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official market calendar'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
