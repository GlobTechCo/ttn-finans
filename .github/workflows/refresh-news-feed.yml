name: Refresh aggregated RSS news
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_news_feed.py'
      - '.github/workflows/refresh-news-feed.yml'
      - 'config.js'
permissions:
  contents: write
concurrency:
  group: ttn-rss-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Read original RSS feeds
        run: python3 scripts/update_news_feed.py
      - name: Save only the attributed RSS snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh attributed financial news snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
